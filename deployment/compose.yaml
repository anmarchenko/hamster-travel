name: hamster-travel-production

x-app: &app
  image: ${HAMSTER_TRAVEL_IMAGE:-hamster-travel-production:current}
  env_file:
    - ${HAMSTER_TRAVEL_APP_ENV_FILE:-/home/marvin/Work/hamster-travel-production/app.env}
  environment:
    PHX_HOST: hamster-travel.tail920074.ts.net
    PHX_SCHEME: https
    PHX_PORT: "443"
    PHX_CHECK_ORIGINS: https://hamster-travel.tail920074.ts.net,http://127.0.0.1:4400,http://192.168.4.90:4400
    PORT: "4000"
    POOL_SIZE: "10"
    AWS_REGION: eu-central-1
    AWS_S3_BUCKET: hamster-travel-prod-images
    S3_ASSET_HOST: https://hamster-travel-prod-images.s3.eu-central-1.amazonaws.com
    HOME: /tmp/chromic-pdf
    CHROMIC_PDF_ON_DEMAND: "false"
    CHROMIC_PDF_POOL_SIZE: "4"
    CHROMIC_PDF_GHOSTSCRIPT_POOL_SIZE: "2"
    CHROMIC_PDF_NO_SANDBOX: "true"
    CHROMIC_PDF_DISCARD_STDERR: "true"
    CHROMIC_PDF_DISABLE_DEV_SHM_USAGE: "false"
    MAGICK_MEMORY_LIMIT: 128MiB
    MAGICK_MAP_LIMIT: 128MiB
    MAGICK_DISK_LIMIT: 1GiB
    MAGICK_TEMPORARY_PATH: /tmp
  networks:
    - production
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g
    - /dev/shm:rw,noexec,nosuid,nodev,size=1g
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024
  mem_limit: 6g
  cpus: 8
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:18-bookworm
    container_name: hamster-travel-production-db
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${HAMSTER_TRAVEL_DATABASE_ENV_FILE:-/home/marvin/Work/hamster-travel-production/database.env}
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-65432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,noexec,mode=0775,uid=999,gid=999
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    read_only: true
    shm_size: 256m
    networks:
      production:
        aliases:
          - postgres
          - hamster-travel-postgres
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  web:
    <<: *app
    container_name: hamster-travel-production-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:4400:4000
      - 192.168.4.90:4400:4000
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *app
    profiles: [ops]
    restart: "no"
    command: [/app/bin/migrate]
    healthcheck:
      disable: true

  verify-storage:
    <<: *app
    profiles: [ops]
    restart: "no"
    command: [/app/bin/hamster_travel, eval, HamsterTravel.Release.verify_waffle_storage]
    healthcheck:
      disable: true

volumes:
  postgres_data:
    name: hamster-travel-production-postgres-18

networks:
  production:
    name: kamal
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hamster-prod
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
